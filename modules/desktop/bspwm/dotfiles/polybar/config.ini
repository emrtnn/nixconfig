[colors]
background = #0f0f0f
surface = #1e1f1e
surface-alpha = #e61e1f1e
foreground = #f4decd
muted = #888e7b
accent = #ef934d
urgent = #f16e65

[bar/network]
monitor = ${env:MONITOR}
monitor-strict = true
override-redirect = false
enable-struts = false
bottom = false
fixed-center = true
width = ${env:ARGOS_BAR_WIDTH}
height = 28
offset-x = ${env:ARGOS_BAR_X}
offset-y = 8
radius = 14
background = ${colors.surface-alpha}
foreground = ${colors.foreground}
dpi = 96
font-0 = ${env:ARGOS_BAR_FONT}
modules-center = network

[bar/vpn]
monitor = ${env:MONITOR}
monitor-strict = true
override-redirect = false
enable-struts = false
bottom = false
fixed-center = true
width = ${env:ARGOS_BAR_WIDTH}
height = 28
offset-x = ${env:ARGOS_BAR_X}
offset-y = 8
radius = 14
background = ${colors.surface-alpha}
foreground = ${colors.foreground}
dpi = 96
font-0 = ${env:ARGOS_BAR_FONT}
modules-center = vpn

[bar/workspaces]
monitor = ${env:MONITOR}
monitor-strict = true
override-redirect = false
enable-struts = false
bottom = false
fixed-center = true
width = ${env:ARGOS_BAR_WIDTH}
height = 28
offset-x = ${env:ARGOS_BAR_X}
offset-y = 8
radius = 14
background = ${colors.surface-alpha}
foreground = ${colors.foreground}
dpi = 96
font-0 = ${env:ARGOS_BAR_FONT}
modules-center = bspwm

[bar/target]
monitor = ${env:MONITOR}
monitor-strict = true
override-redirect = false
enable-struts = false
bottom = false
fixed-center = true
width = ${env:ARGOS_BAR_WIDTH}
height = 28
offset-x = ${env:ARGOS_BAR_X}
offset-y = 8
radius = 14
background = ${colors.surface-alpha}
foreground = ${colors.foreground}
dpi = 96
font-0 = ${env:ARGOS_BAR_FONT}
modules-center = target

[bar/power]
monitor = ${env:MONITOR}
monitor-strict = true
override-redirect = false
enable-struts = false
bottom = false
fixed-center = true
width = ${env:ARGOS_BAR_WIDTH}
height = 28
offset-x = ${env:ARGOS_BAR_X}
offset-y = 8
radius = 14
background = ${colors.surface-alpha}
foreground = ${colors.foreground}
dpi = 96
font-0 = ${env:ARGOS_BAR_FONT}
modules-center = power

[module/network]
type = custom/script
exec = argos-network watch
tail = true
format = <label>
label = %output%
click-left = argos-network toggle

[module/vpn]
type = custom/script
exec = argos-network vpn
interval = 2
format = <label>
label = %output%
click-left = argos-network vpn-copy

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
reverse-scroll = false
occupied-scroll = true
format = <label-state>
label-focused = %name%
label-focused-foreground = ${colors.accent}
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.urgent}
label-separator = " "

[module/target]
type = custom/script
exec = argos-target show
interval = 1
format = <label>
label = %output%
label-maxlen = 22
label-ellipsis = true
click-left = argos-target copy
click-right = argos-target menu

[module/power]
type = custom/text
format = <label>
label = 
format-foreground = ${colors.accent}
click-left = argos-menu power
